<div class="card product-card h-100 shadow-sm" data-product-id="{{product.id}}">

  {% if product.thumbnail %}
  <a href="{% url 'product_details' product.pk %}" class="text-secondary text-decoration-none">
    <img src="{{ product.thumbnail.url }}" class="card-img-top product-thumb" alt="{{ product.title }}">
  </a>
  {% else %}
  <div class="product-thumb placeholder-img">
    No Image
  </div>
  {% endif %}



  <div class="card-body d-flex flex-column">
    <a href="{% url 'product_details' product.pk %}" class="text-secondary text-decoration-none">
      <h4 class="card-title product-title">
        {{ product.title }}
      </h4>
    </a>


    <p class="card-text product-desc">
      {{ product.desc|truncatechars:70 }}
    </p>
    <div class="mt-auto">
      <div class="product-price mb-2 text-success">
        ₹ {{ product.price }}
      </div>

      {% if user.is_staff %}

      {% if product.stock > 0 %}
      <button class="btn btn-success btn-sm w-100 rounded-5">
        In Stock ({{ product.stock }})
      </button>
      {% else %}
      <button class="btn btn-danger btn-sm w-100 rounded-5">
        Out of Stock
      </button>
      {% endif %}

      {% else %}

      {% if product.stock > 0 %}
      <button class="btn btn-success w-100 add-to-cart rounded-5" id="add_to_cart_btn">
        Add to Cart
      </button>
      {% else %}
      <button class="btn btn-danger btn-sm w-100 rounded-5" disabled>
        Out of Stock
      </button>
      {% endif %}

      {% endif %}
    </div>
    </a>
  </div>

</div>
